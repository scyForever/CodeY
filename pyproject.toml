[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codey"
version = "0.1.0"
description = "Repository rule-governance and canary-testing assistant for CodeY, Codex, Claude, and Cursor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
codey = "CodeY.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["CodeY*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
